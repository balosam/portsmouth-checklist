<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --card: #1f2235;
    --border: #2a2d45;
    --accent: #4f8ef7;
    --accent-green: #34d399;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 60px; }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .header p { color: var(--muted); font-size: 0.9rem; }
  .sync-status { text-align: center; font-size: 0.8rem; margin-bottom: 8px; padding: 4px 12px; border-radius: 99px; display: inline-block; }
  .sync-status.synced { color: var(--accent-green); }
  .sync-status.syncing { color: var(--accent); }
  .sync-status.error { color: var(--danger); }
  .sync-wrap { text-align: center; margin-bottom: 16px; }
  .progress-bar-wrap { background: var(--border); border-radius: 99px; height: 10px; margin: 16px auto; max-width: 600px; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, var(--accent), var(--accent-green)); height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .progress-label { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; }
  .progress-label span { color: var(--accent-green); font-weight: 600; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: var(--border); color: var(--text); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; overflow: hidden; max-width: 760px; margin-left: auto; margin-right: auto; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; background: var(--surface); user-select: none; gap: 10px; }
  .section-header:hover { background: var(--border); }
  .section-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .section-emoji { font-size: 1.2rem; }
  .section-count { font-size: 0.78rem; background: var(--bg); padding: 2px 8px; border-radius: 99px; color: var(--muted); white-space: nowrap; }
  .section-count.done { color: var(--accent-green); }
  .chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section-body { padding: 10px 18px 14px; }
  .section.collapsed .section-body { display: none; }
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .item:last-of-type { border-bottom: none; }
  .item input[type="checkbox"] { width: 18px; height: 18px; min-width: 18px; accent-color: var(--accent-green); cursor: pointer; margin-top: 2px; }
  .item-label { flex: 1; font-size: 0.92rem; line-height: 1.5; cursor: pointer; transition: color 0.2s; }
  .item-label.checked { text-decoration: line-through; color: var(--muted); }
  .item-note { font-size: 0.78rem; color: var(--muted); display: block; margin-top: 2px; }
  .item-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; opacity: 0; padding: 0 4px; transition: opacity 0.2s; }
  .item:hover .item-delete { opacity: 1; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 0.88rem; outline: none; }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--muted); }
  .add-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 0.88rem; white-space: nowrap; }
  .add-btn:hover { opacity: 0.85; }
  .saved-badge { position: fixed; bottom: 20px; right: 20px; background: var(--accent-green); color: #0f1117; padding: 8px 16px; border-radius: 99px; font-size: 0.82rem; font-weight: 700; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .saved-badge.show { opacity: 1; }
  .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
  .loading-overlay p { color: var(--muted); font-size: 0.9rem; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 500px) { .header h1 { font-size: 1.4rem; } .controls { gap: 8px; } }
</style>

let state = { checks: {}, customItems: {} };
let saveTimeout = null;

async function loadFromSupabase() {
  try {
    setSync('syncing', '⟳ Loading...');
    const { data, error } = await db
      .from('checklist_progress')
      .select('data')
      .eq('user_id', USER_ID)
      .single();

    if (error && error.code !== 'PGRST116') throw error;
    if (data && data.data) {
      state = data.data;
    }
    setSync('synced', '✓ Synced across all devices');
  } catch (e) {
    console.error('Load error:', e);
    setSync('error', '⚠ Could not load — using local data');
    try {
      const local = localStorage.getItem('sam_checklist_backup');
      if (local) state = JSON.parse(local);
    } catch {}
  }
}

async function saveToSupabase() {
  try {
    setSync('syncing', '⟳ Saving...');
    localStorage.setItem('sam_checklist_backup', JSON.stringify(state));
    const { error } = await db
      .from('checklist_progress')
      .upsert({ user_id: USER_ID, data: state, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
    if (error) throw error;
    setSync('synced', '✓ Synced across all devices');
    showSaved();
  } catch (e) {
    console.error('Save error:', e);
    setSync('error', '⚠ Saved locally only');
    showSaved();
  }
}

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToSupabase, 800);
}

function setSync(type, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + type;
  el.textContent = text;
}

let savedTimeout;
function showSaved() {
  const badge = document.getElementById('savedBadge');
  badge.classList.add('show');
  clearTimeout(savedTimeout);
  savedTimeout = setTimeout(() => badge.classList.remove('show'), 2000);
}

function updateProgress() {
  let total = 0, done = 0;
  document.querySelectorAll('.item input[type="checkbox"]').forEach(cb => {
    total++;
    if (cb.checked) done++;
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `<span>${done} of ${total}</span> items packed (${pct}%)`;
  defaultSections.forEach(section => {
    const sectionEl = document.getElementById('section-' + section.id);
    if (!sectionEl) return;
    const cbs = sectionEl.querySelectorAll('input[type="checkbox"]');
    const sectionDone = [...cbs].filter(c => c.checked).length;
    const countEl = sectionEl.querySelector('.section-count');
    if (countEl) {
      countEl.textContent = `${sectionDone}/${cbs.length}`;
      countEl.className = 'section-count' + (sectionDone === cbs.length && cbs.length > 0 ? ' done' : '');
    }
  });
}

function buildSections() {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';
  defaultSections.forEach(section => {
    const customKey = 'custom_' + section.id;
    const customItems = state.customItems[customKey] || [];
    const allItems = [...section.items, ...customItems];
    const doneItems = allItems.filter(item => state.checks[item.id]).length;
    const el = document.createElement('div');
    el.className = 'section';
    el.id = 'section-' + section.id;
    el.innerHTML = `
      <div class="section-header" onclick="toggleSection('${section.id}')">
        <div class="section-title"><span class="section-emoji">${section.emoji}</span>${section.title}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="section-count ${doneItems === allItems.length && allItems.length > 0 ? 'done' : ''}">${doneItems}/${allItems.length}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="section-body">
        <div id="items-${section.id}"></div>
        <div class="add-row">
          <input class="add-input" id="add-input-${section.id}" placeholder="Add item to this section..." onkeydown="if(event.key==='Enter')addItem('${section.id}')">
          <button class="add-btn" onclick="addItem('${section.id}')">+ Add</button>
        </div>
      </div>`;
    container.appendChild(el);
    const itemsContainer = document.getElementById('items-' + section.id);
    allItems.forEach(item => renderItem(itemsContainer, item, section.id));
  });
  updateProgress();
}

function renderItem(container, item, sectionId) {
  const isCustom = item.id.startsWith('custom_');
  const checked = !!state.checks[item.id];
  const div = document.createElement('div');
  div.className = 'item';
  div.id = 'item-' + item.id;
  div.innerHTML = `
    <input type="checkbox" id="cb-${item.id}" ${checked ? 'checked' : ''} onchange="toggleCheck('${item.id}')">
    <label class="item-label ${checked ? 'checked' : ''}" for="cb-${item.id}">
      ${item.text}${item.note ? `<span class="item-note">${item.note}</span>` : ''}
    </label>
    ${isCustom ? `<button class="item-delete" onclick="deleteCustomItem('${sectionId}','${item.id}')" title="Remove">✕</button>` : ''}`;
  container.appendChild(div);
}

function toggleCheck(itemId) {
  state.checks[itemId] = !state.checks[itemId];
  const label = document.querySelector(`label[for="cb-${itemId}"]`);
  if (label) label.className = 'item-label' + (state.checks[itemId] ? ' checked' : '');
  scheduleSave();
  updateProgress();
}

function toggleSection(sectionId) {
  document.getElementById('section-' + sectionId).classList.toggle('collapsed');
}

function addItem(sectionId) {
  const input = document.getElementById('add-input-' + sectionId);
  const text = input.value.trim();
  if (!text) return;
  const customKey = 'custom_' + sectionId;
  if (!state.customItems[customKey]) state.customItems[customKey] = [];
  const newItem = { id: 'custom_' + Date.now(), text, note: '' };
  state.customItems[customKey].push(newItem);
  input.value = '';
  renderItem(document.getElementById('items-' + sectionId), newItem, sectionId);
  scheduleSave();
  updateProgress();
}

function deleteCustomItem(sectionId, itemId) {
  const customKey = 'custom_' + sectionId;
  if (!state.customItems[customKey]) return;
  state.customItems[customKey] = state.customItems[customKey].filter(i => i.id !== itemId);
  delete state.checks[itemId];
  const el = document.getElementById('item-' + itemId);
  if (el) el.remove();
  scheduleSave();
  updateProgress();
}

function expandAll() { document.querySelectorAll('.section.collapsed').forEach(s => s.classList.remove('collapsed')); }
function collapseAll() { document.querySelectorAll('.section:not(.collapsed)').forEach(s => s.classList.add('collapsed')); }

function uncheckAll() {
  if (!confirm('Reset all ticked items? Your added items will stay.')) return;
  state.checks = {};
  document.querySelectorAll('.item input[type="checkbox"]').forEach(cb => cb.checked = false);
  document.querySelectorAll('.item-label').forEach(l => l.classList.remove('checked'));
  scheduleSave();
  updateProgress();
}

function clearCustomItems() {
  if (!confirm('Remove all your custom added items?')) return;
  state.customItems = {};
  buildSections();
  scheduleSave();
}

async function init() {
  await loadFromSupabase();
  buildSections();
  document.getElementById('loadingOverlay').style.display = 'none';
}

init();
</script>
</body>
</html>
